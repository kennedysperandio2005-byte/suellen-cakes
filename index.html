<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suellen Cakes - Faça seu Pedido</title>
    <style>
        :root {
            --primary-color: #d63384;
            --primary-hover: #b02a6b;
            --bg-color: #fff0f5;
            --card-bg: #ffffff;
            --text-color: #333333;
            --border-color: #f8d7da;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(214, 51, 132, 0.1);
        }

        h1 {
            text-align: center;
            color: var(--primary-color);
            margin-bottom: 25px;
        }

        fieldset {
            border: 2px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            background-color: #fff;
        }

        legend {
            font-weight: bold;
            color: var(--primary-color);
            padding: 0 8px;
        }

        label {
            display: block;
            margin-top: 10px;
            font-weight: 500;
        }

        input[type="text"], select, textarea {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }

        .checkbox-group {
            margin: 15px 0;
        }

        .checkbox-group label {
            display: inline;
            font-weight: normal;
            margin-left: 8px;
        }

        .hidden {
            display: none;
        }

        .total-box {
            text-align: right;
            font-size: 18px;
            font-weight: bold;
            color: var(--primary-color);
            margin: 20px 0;
        }

        button.btn-whatsapp {
            background-color: #25d366;
            color: white;
            border: none;
            width: 100%;
            padding: 15px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s;
        }

        button.btn-whatsapp:hover {
            background-color: #1ebe5d;
        }

        .andar-section {
            border-top: 1px dashed #ccc;
            margin-top: 15px;
            padding-top: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🎂 Suellen Cakes 🍰</h1>
        
        <form id="form-pedido">
            <!-- Seleção de Categorias -->
            <fieldset>
                <legend>O que você deseja pedir?</legend>
                <div class="checkbox-group">
                    <input type="checkbox" id="check-bolo" onchange="toggleSecao('bolo')">
                    <label for="check-bolo">Bolo Personalizado</label>
                </div>
                <div class="checkbox-group">
                    <input type="checkbox" id="check-doces" onchange="toggleSecao('doces')">
                    <label for="check-doces">Doces Finos / Brigadeiros</label>
                </div>
                <div class="checkbox-group">
                    <input type="checkbox" id="check-sobremesa" onchange="toggleSecao('sobremesa')">
                    <label for="check-sobremesa">Sobremesas</label>
                </div>
                <div class="checkbox-group">
                    <input type="checkbox" id="check-caseiro" onchange="toggleSecao('caseiro')">
                    <label for="check-caseiro">Bolo Caseiro</label>
                </div>
            </fieldset>

            <!-- Seção de Bolos -->
            <div id="secao-bolo" class="hidden">
                <fieldset>
                    <legend>Detalhes do Bolo</legend>
                    <label for="tipo-bolo">Quantidade de Andares:</label>
                    <select id="tipo-bolo" onchange="atualizarAndares()">
                        <option value="1">1 Andar</option>
                        <option value="2">2 Andares</option>
                        <option value="3">3 Andares</option>
                    </select>

                    <label for="massa-bolo">Tipo de Massa:</label>
                    <select id="massa-bolo">
                        <option value="Branca Tradicional">Branca Tradicional</option>
                        <option value="Chocolate">Chocolate</option>
                        <option value="Mista">Mista</option>
                    </select>

                    <div id="container-andares"></div>
                </fieldset>
            </div>

            <!-- Seção de Doces -->
            <div id="secao-doces" class="hidden">
                <fieldset>
                    <legend>Doces</legend>
                    <label for="qtd-doces">Escolha a Caixa / Quantidade:</label>
                    <select id="qtd-doces">
                        <option value="caixa-12">Caixa com 12 unidades</option>
                        <option value="caixa-25">Caixa com 25 unidades</option>
                        <option value="caixa-50">Caixa com 50 unidades</option>
                    </select>
                </fieldset>
            </div>

            <!-- Seção de Sobremesas -->
            <div id="secao-sobremesa" class="hidden">
                <fieldset>
                    <legend>Sobremesas</legend>
                    <label for="item-sobremesa">Escolha a Sobremesa:</label>
                    <select id="item-sobremesa">
                        <option value="pave">Pavê Tradicional</option>
                        <option value="torta-holandesa">Torta Holandesa</option>
                        <option value="mousse">Mousse de Ninho com Morango</option>
                    </select>
                </fieldset>
            </div>

            <!-- Seção de Bolos Caseiros -->
            <div id="secao-caseiro" class="hidden">
                <fieldset>
                    <legend>Bolo Caseiro</legend>
                    <label for="item-caseiro">Sabor do Bolo Caseiro:</label>
                    <select id="item-caseiro">
                        <option value="cenoura-chocolate">Bolo de Cenoura com Cobertura de Chocolate</option>
                        <option value="fuba-cremosa">Bolo de Fubá Cremoso</option>
                        <option value="coco-gelado">Bolo de Coco Gelado</option>
                    </select>
                </fieldset>
            </div>

            <!-- Adicionais -->
            <fieldset>
                <legend>Adicionais</legend>
                <div class="checkbox-group">
                    <input type="checkbox" id="add-topper">
                    <label for="add-topper">Topper Personalizado</label>
                </div>
                <div class="checkbox-group">
                    <input type="checkbox" id="add-embalagem">
                    <label for="add-embalagem">Embalagem Especial para Presente</label>
                </div>
            </fieldset>

            <!-- Forma de Entrega -->
            <fieldset>
                <legend>Entrega</legend>
                <label for="forma-entrega">Forma de Retirada/Entrega:</label>
                <select id="forma-entrega" onchange="toggleEndereco()">
                    <option value="retirada">Retirada na Confeitaria</option>
                    <option value="entrega">Entrega em Domicílio</option>
                </select>

                <div id="campo-endereco" class="hidden">
                    <label for="endereco-cliente">Endereço Completo:</label>
                    <textarea id="endereco-cliente" placeholder="Rua, Número, Bairro, Ponto de Referência"></textarea>
                </div>
            </fieldset>

            <div class="total-box">
                Total Estimado: <span id="preco-total">R$ 0,00</span>
            </div>

            <button type="button" class="btn-whatsapp" onclick="enviarPedidoWhatsApp()">Enviar Pedido via WhatsApp</button>
        </form>
    </div>

    <script>
        function toggleSecao(secao) {
            const checkbox = document.getElementById(`check-${secao}`);
            const divSecao = document.getElementById(`secao-${secao}`);
            if (checkbox.checked) {
                divSecao.classList.remove('hidden');
                if (secao === 'bolo') atualizarAndares();
            } else {
                divSecao.classList.add('hidden');
            }
            calcularTotal();
        }

        function atualizarAndares() {
            const qtdAndares = document.getElementById('tipo-bolo').value;
            const container = document.getElementById('container-andares');
            container.innerHTML = '';

            for (let i = 1; i <= qtdAndares; i++) {
                container.innerHTML += `
                    <div class="andar-section">
                        <label><strong>${i}º Andar - Recheios:</strong></label>
                        <input type="text" id="r1-andar-${i}" placeholder="1º Recheio">
                        <input type="text" id="r2-andar-${i}" placeholder="2º Recheio (Opcional)">
                        <input type="text" id="r3-andar-${i}" placeholder="3º Recheio (Opcional)">
                    </div>
                `;
            }
        }

        function toggleEndereco() {
            const forma = document.getElementById('forma-entrega').value;
            const campoEndereco = document.getElementById('campo-endereco');
            if (forma === 'entrega') {
                campoEndereco.classList.remove('hidden');
            } else {
                campoEndereco.classList.add('hidden');
            }
        }

        function calcularTotal() {
            // Lógica básica de exemplo para simular um valor total
            let total = 0;
            if (document.getElementById('check-bolo').checked) total += 90;
            if (document.getElementById('check-doces').checked) total += 50;
            if (document.getElementById('check-sobremesa').checked) total += 60;
            if (document.getElementById('check-caseiro').checked) total += 35;
            if (document.getElementById('add-topper').checked) total += 20;
            if (document.getElementById('add-embalagem').checked) total += 15;

            document.getElementById('preco-total').innerText = `R$ ${total.toFixed(2).replace('.', ',')}`;
        }

        // Atualizar preço dinamicamente ao marcar/desmarcar adicionais
        document.getElementById('add-topper').addEventListener('change', calcularTotal);
        document.getElementById('add-embalagem').addEventListener('change', calcularTotal);

        function enviarPedidoWhatsApp() {
            const temBolo = document.getElementById('check-bolo').checked;
            const temDoces = document.getElementById('check-doces').checked;
            const temSobremesa = document.getElementById('check-sobremesa').checked;
            const temCaseiro = document.getElementById('check-caseiro').checked;

            if (!temBolo && !temDoces && !temSobremesa && !temCaseiro) {
                alert("Por favor, selecione pelo menos um item para o seu pedido antes de enviar.");
                return;
            }

            const formaEntrega = document.getElementById('forma-entrega').value;
            let endereco = "";
            if (formaEntrega === 'entrega') {
                endereco = document.getElementById('endereco-cliente').value;
                if (!endereco.trim()) {
                    alert("Por favor, preencha o endereço de entrega.");
                    return;
                }
            }

            let mensagem = "Olá! Gostaria de fazer o seguinte pedido na Suellen Cakes:\n\n";

            if (temBolo) {
                const qtdAndares = document.getElementById('tipo-bolo').value;
                const massa = document.getElementById('massa-bolo').value;
                mensagem += `🎂 *Bolo Personalizado* (${qtdAndares} Andar/es)\n- Massa: ${massa}\n`;
                for (let i = 1; i <= qtdAndares; i++) {
                    const r1 = document.getElementById(`r1-andar-${i}`).value;
                    const r2 = document.getElementById(`r2-andar-${i}`).value;
                    const r3 = document.getElementById(`r3-andar-${i}`).value;
                    mensagem += `  - ${i}º Andar Recheios: ${r1}${r2 ? ', ' + r2 : ''}${r3 ? ', ' + r3 : ''}\n`;
                }
                mensagem += "\n";
            }

            if (temDoces) {
                const selectDoces = document.getElementById('qtd-doces');
                mensagem += `🍬 *Doces:* ${selectDoces.options[selectDoces.selectedIndex].text}\n\n`;
            }

            if (temSobremesa) {
                const selectSobremesa = document.getElementById('item-sobremesa');
                mensagem += `🍮 *Sobremesa:* ${selectSobremesa.options[selectSobremesa.selectedIndex].text}\n\n`;
            }

            if (temCaseiro) {
                const selectCaseiro = document.getElementById('item-caseiro');
                mensagem += `🥮 *Bolo Caseiro:* ${selectCaseiro.options[selectCaseiro.selectedIndex].text}\n\n`;
            }

            if (document.getElementById('add-topper').checked) {
                mensagem += "🎈 Adicional: Topper Personalizado\n";
            }
            if (document.getElementById('add-embalagem').checked) {
                mensagem += "🎁 Adicional: Embalagem Especial para Presente\n";
            }

            mensagem += `\n📦 *Forma de Entrega:* ${formaEntrega === 'entrega' ? 'Entrega em Domicílio' : 'Retirada na Confeitaria'}\n`;
            if (formaEntrega === 'entrega') {
                mensagem += `📍 *Endereço:* ${endereco}\n`;
            }

            mensagem += `\n💰 *Total Estimado:* ${document.getElementById('preco-total').innerText}`;

            const numeroWhatsApp = "5527995336204";
            const urlEncoded = encodeURIComponent(mensagem);
            window.open(`https://wa.me/${numeroWhatsApp}?text=${urlEncoded}`, '_blank');
        }
    </script>
</body>
</html>
