<script>
        let categoriaAtualAtiva = 'bolo';

        const listaRecheios = [
            "Brigadeiro", "Ninho", "Nutella (+ R$ 15,00)", "Morango", "Abacaxi", 
            "Doce de leite", "Nozes", "Café", "Ganache", "Coco", "Amendoim", 
            "Pêssego", "Ameixa", "Brigadeiro branco", "Oreo", "Geleia de morango", 
            "Geleia de frutas vermelhas"
        ];

        const recheiosBoloPote = [
            "Oreo", "Frutas Vermelhas", "Morango", "Chocolate", "Ninho", 
            "Doce de leite", "Amendoim", "Café", "Limão", "Maracujá", 
            "Nozes", "Coco", "Dois amor (ninho, brigadeiro)", "Abacaxi", "Nutella", "Geleia de morango"
        ];

        const recheiosCopoFelicidade = [
            "Oreo", "Chocolate", "Ninho", "Doce de leite", "Amendoim", 
            "Limão", "Maracujá", "Coco", "Nutella"
        ];

        function verificarStatusFuncionamento() {
            const agora = new Date();
            const diaSemana = agora.getDay();
            const hora = agora.getHours();
            const minutos = agora.getMinutes();
            const horaDecimal = hora + minutos / 60;

            let aberto = false;
            if (diaSemana >= 1 && diaSemana <= 6) {
                if (horaDecimal >= 8 && horaDecimal < 19) {
                    aberto = true;
                }
            }

            const containerStatus = document.getElementById('indicador-status');
            if (containerStatus) {
                if (aberto) {
                    containerStatus.innerHTML = '<span class="status-funcionamento status-aberto">🟢 Aberto agora</span>';
                } else {
                    containerStatus.innerHTML = '<span class="status-funcionamento status-fechado">🔴 Fechado no momento</span>';
                }
            }
        }

        function popularSelectsRecheio() {
            for (let andar = 1; andar <= 3; andar++) {
                for (let r = 1; r <= 3; r++) {
                    const select = document.getElementById(`r${r}-andar-${andar}`);
                    if (!select) continue;
                    select.innerHTML = '';

                    if (r === 1) {
                        select.innerHTML = `<option value="" selected disabled>-- Escolha o 1º recheio --</option>`;
                        listaRecheios.forEach(rec => {
                            select.innerHTML += `<option value="${rec}">${rec}</option>`;
                        });
                    } else {
                        select.innerHTML = `<option value="" selected>-- Nenhum ${r}º recheio --</option>`;
                        listaRecheios.forEach(rec => {
                            select.innerHTML += `<option value="${rec}">${rec}</option>`;
                        });
                    }
                }
            }

            const rPote1 = document.getElementById('recheio-sobremesa-1');
            const rPote2 = document.getElementById('recheio-sobremesa-2');
            if (rPote1 && rPote2) {
                rPote1.innerHTML = `<option value="" selected disabled>-- 1º Recheio --</option>`;
                rPote2.innerHTML = `<option value="" selected>-- 2º Recheio (Opcional) --</option>`;
                recheiosBoloPote.forEach(rec => {
                    rPote1.innerHTML += `<option value="${rec}">${rec}</option>`;
                    rPote2.innerHTML += `<option value="${rec}">${rec}</option>`;
                });
            }

            const rCopo1 = document.getElementById('recheio-copo-1');
            const rCopo2 = document.getElementById('recheio-copo-2');
            if (rCopo1 && rCopo2) {
                rCopo1.innerHTML = `<option value="" selected disabled>-- 1º Recheio --</option>`;
                rCopo2.innerHTML = `<option value="" selected>-- 2º Recheio (Opcional) --</option>`;
                recheiosCopoFelicidade.forEach(rec => {
                    rCopo1.innerHTML += `<option value="${rec}">${rec}</option>`;
                    rCopo2.innerHTML += `<option value="${rec}">${rec}</option>`;
                });
            }
        }

        function atualizarTopoGeral() {
            const qtdAndares = parseInt(document.getElementById('tipo-bolo').value);
            const selectTopo = document.getElementById('topo-bolo-geral');
            if (!selectTopo) return;

            selectTopo.innerHTML = `<option value="0">Sem Topo</option>`;

            if (qtdAndares === 2) {
                selectTopo.innerHTML += `<option value="18.00">Topo para bolo de 2 andares - R$ 18,00</option>`;
            } else if (qtdAndares === 3) {
                selectTopo.innerHTML += `<option value="25.00">Topo para bolo de 3 andares - R$ 25,00</option>`;
            } else {
                selectTopo.innerHTML += `<option value="12.00">Topo para bolo de 1 andar - R$ 12,00</option>`;
            }
        }

        window.onload = function() {
            verificarStatusFuncionamento();
            popularSelectsRecheio();
            atualizarTopoGeral();
            
            document.getElementById('forma-entrega').value = 'retirada';
            document.getElementById('painel-frete').style.display = 'none';

            calcularTotal();
        };

        function mostrarTela(idTela) {
            document.querySelectorAll('.tela-pagina').forEach(tela => {
                tela.style.display = 'none';
            });
            document.getElementById(idTela).style.display = 'block';

            const barraNav = document.getElementById('barra-top-navegacao');
            if (idTela === 'tela-montagem' || idTela === 'tela-detalhe-galeria') {
                barraNav.style.display = 'flex';
            } else {
                barraNav.style.display = 'none';
            }
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function voltarParaInicio() {
            mostrarTela('tela-inicio');
        }

        function abrirCategoriaGaleria(categoriaKey, nomeTitulo) {
            document.getElementById('titulo-categoria-galeria').innerText = nomeTitulo;
            const gridFotos = document.getElementById('grid-fotos-categoria');
            
            let fotosHTML = '';
            for (let i = 1; i <= 4; i++) {
                fotosHTML += `
                    <div class="foto-item" style="background: #fff; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); text-align: center;">
                        <div class="img-placeholder" style="margin-bottom: 10px;"><img src="imagens/logo.png" alt="${nomeTitulo} ${i}" style="width: 100%; height: 150px; object-fit: cover; border-radius: 4px;"></div>
                        <h4 style="margin-top: 8px; color: #444; font-size: 0.95rem;">${nomeTitulo} - Exemplo ${i}</h4>
                    </div>
                `;
            }
            gridFotos.innerHTML = fotosHTML;
            mostrarTela('tela-detalhe-galeria');
        }

        function voltarParaGaleriaPrincipal() {
            mostrarTela('tela-inicio');
            setTimeout(() => {
                document.getElementById('galeria').scrollIntoView({ behavior: 'smooth' });
            }, 100);
        }

        function abrirMontagem(categoria) {
            categoriaAtualAtiva = categoria;
            mostrarTela('tela-montagem');

            document.getElementById('painel-montar-bolo').style.display = (categoria === 'bolo') ? 'block' : 'none';
            document.getElementById('painel-montar-doces-finos').style.display = (categoria === 'doces-finos') ? 'block' : 'none';
            document.getElementById('painel-montar-doces-tradicionais').style.display = (categoria === 'doces-tradicionais') ? 'block' : 'none';
            document.getElementById('painel-montar-doces-gourmet').style.display = (categoria === 'doces-gourmet') ? 'block' : 'none';
            document.getElementById('painel-montar-sobremesa').style.display = (categoria === 'sobremesa') ? 'block' : 'none';
            document.getElementById('painel-montar-caseiro').style.display = (categoria === 'caseiro') ? 'block' : 'none';

            let tituloTela = "Monte Seu Pedido";
            if (categoria === 'bolo') tituloTela = "Monte Seu Bolo Festivo";
            else if (categoria === 'doces-finos') tituloTela = "Escolher Doces Finos";
            else if (categoria === 'doces-tradicionais') tituloTela = "Escolher Doces Tradicionais";
            else if (categoria === 'doces-gourmet') tituloTela = "Escolher Doces Gourmet";
            else if (categoria === 'sobremesa') tituloTela = "Escolher e Montar Sobremesas";
            else if (categoria === 'caseiro') tituloTela = "Monte seu Bolo Caseiro";

            document.getElementById('titulo-tela-montagem').innerText = tituloTela;
            calcularTotal();
        }

        function atualizarAndaresBolo() {
            const qtdAndares = parseInt(document.getElementById('tipo-bolo').value);
            document.getElementById('painel-andar-1').style.display = 'block';
            document.getElementById('painel-andar-2').style.display = (qtdAndares >= 2) ? 'block' : 'none';
            document.getElementById('painel-andar-3').style.display = (qtdAndares >= 3) ? 'block' : 'none';
            
            atualizarTopoGeral();
        }

        function tratarMudancaEntrega() {
            const tipoEntrega = document.getElementById('forma-entrega').value;
            const painelFrete = document.getElementById('painel-frete');
            painelFrete.style.display = (tipoEntrega === 'entrega') ? 'block' : 'none';
        }

        function calcularTotal() {
            let total = 0;
            let resumoItensHTML = '';

            const tamanho1 = document.getElementById('tamanho-andar-1').value;
            const recheio1 = document.getElementById('r1-andar-1').value;
            if (categoriaAtualAtiva === 'bolo' && tamanho1 && recheio1) {
                const qtdAndares = parseInt(document.getElementById('tipo-bolo').value);
                let subtotalBolo = 0;

                if (document.getElementById('massa-bolo').value.includes('Red Velvet')) subtotalBolo += 10;

                for (let andar = 1; andar <= qtdAndares; andar++) {
                    const valTamanho = parseFloat(document.getElementById(`tamanho-andar-${andar}`).value);
                    subtotalBolo += valTamanho;

                    const r1 = document.getElementById(`r1-andar-${andar}`).value;
                    const r2 = document.getElementById(`r2-andar-${andar}`).value;
                    const r3 = document.getElementById(`r3-andar-${andar}`).value;

                    if (r1 && r1.includes('Nutella')) subtotalBolo += 15;
                    if (r2 && r2.includes('Nutella')) subtotalBolo += 15;
                    if (r3 && r3.includes('Nutella')) subtotalBolo += 15;
                }

                const valTopoGeral = parseFloat(document.getElementById('topo-bolo-geral').value) || 0;
                if (valTopoGeral > 0) {
                    subtotalBolo += valTopoGeral;
                }

                total += subtotalBolo;
                resumoItensHTML += `<div class="item-resumo-carrinho"><span>🎂 Bolo Personalizado (${qtdAndares} Andar/es)</span> <strong>R$ ${subtotalBolo.toFixed(2).replace('.', ',')}</strong></div>`;
            }

            const valDocesFinos = parseFloat(document.getElementById('qtd-doces-finos').value) || 0;
            if (categoriaAtualAtiva === 'doces-finos' && valDocesFinos > 0) {
                total += valDocesFinos;
                const textoOpcaoFinos = document.getElementById('qtd-doces-finos').options[document.getElementById('qtd-doces-finos').selectedIndex].text;
                resumoItensHTML += `<div class="item-resumo-carrinho"><span>🍬 ${textoOpcaoFinos}</span></div>`;
            }

            const valDocesTrad = parseFloat(document.getElementById('qtd-doces-tradicionais').value) || 0;
            if (categoriaAtualAtiva === 'doces-tradicionais' && valDocesTrad > 0) {
                total += valDocesTrad;
                const selectTrad = document.getElementById('qtd-doces-tradicionais');
                const textoOpcaoTrad = selectTrad.options[selectTrad.selectedIndex].text.split('(')[0].trim();
                
                let saboresSelecionados = [];
                document.querySelectorAll('input[name="sabor-tradicional"]:checked').forEach(cb => {
                    saboresSelecionados.push(cb.value);
                });

                let textoSabores = saboresSelecionados.length > 0 ? `<br><small style="color: #666;">Sabores: ${saboresSelecionados.join(', ')}</small>` : '';
                resumoItensHTML += `<div class="item-resumo-carrinho"><span>🍬 ${textoOpcaoTrad} (${valDocesTrad.toLocaleString('pt-BR', {style: 'currency', currency: 'BRL'})})${textoSabores}</span></div>`;
            }

            const valDocesGourmet = parseFloat(document.getElementById('qtd-doces-gourmet').value) || 0;
            if (categoriaAtualAtiva === 'doces-gourmet' && valDocesGourmet > 0) {
                total += valDocesGourmet;
                const selectGourmet = document.getElementById('qtd-doces-gourmet');
                const textoOpcaoGourmet = selectGourmet.options[selectGourmet.selectedIndex].text.split('(')[0].trim();
                
                let saboresGourmetSelecionados = [];
                document.querySelectorAll('input[name="sabor-gourmet"]:checked').forEach(cb => {
                    saboresGourmetSelecionados.push(cb.value);
                });

                let textoSaboresGourmet = saboresGourmetSelecionados.length > 0 ? `<br><small style="color: #666;">Sabores: ${saboresGourmetSelecionados.join(', ')}</small>` : '';
                resumoItensHTML += `<div class="item-resumo-carrinho"><span>🍬 ${textoOpcaoGourmet} (${valDocesGourmet.toLocaleString('pt-BR', {style: 'currency', currency: 'BRL'})})${textoSaboresGourmet}</span></div>`;
            }

            if (categoriaAtualAtiva === 'sobremesa') {
                const massaSobremesa = document.getElementById('tipo-massa-sobremesa').value;
                if (massaSobremesa) {
                    let valBoloPote = 15.00;
                    total += valBoloPote;
                    let r1Pote = document.getElementById('recheio-sobremesa-1').value;
                    let r2Pote = document.getElementById('recheio-sobremesa-2').value;
                    let textoPoteRecheio = r1Pote ? r1Pote : '';
                    if (r2Pote) textoPoteRecheio += `, ${r2Pote}`;

                    resumoItensHTML += `<div class="item-resumo-carrinho"><span>🍰 Bolo de Pote / Fatia<br><small style="color: #666;">Massa: ${massaSobremesa} | Recheios: ${textoPoteRecheio || 'Nenhum'}</small></span> <strong>R$ ${valBoloPote.toFixed(2).replace('.', ',')}</strong></div>`;
                }

                const selectPronta = document.getElementById('sobremesa-pronta');
                if (selectPronta.value) {
                    let textoPronta = selectPronta.options[selectPronta.selectedIndex].text;
                    let valPronta = 50.00;
                    if (textoPronta.includes('45,00')) valPronta = 45.00;
                    if (textoPronta.includes('55,00')) valPronta = 55.00;
                    if (textoPronta.includes('60,00')) valPronta = 60.00;

                    total += valPronta;
                    resumoItensHTML += `<div class="item-resumo-carrinho"><span>🍮 ${textoPronta}</span></div>`;
                }

                const baseCopo = document.getElementById('base-copo-felicidade').value;
                if (baseCopo) {
                    let valCopo = 22.00;
                    total += valCopo;
                    let rCopo1 = document.getElementById('recheio-copo-1').value;
                    let rCopo2 = document.getElementById('recheio-copo-2').value;
                    let textoCopoRecheio = rCopo1 ? rCopo1 : '';
                    if (rCopo2) textoCopoRecheio += `, ${rCopo2}`;

                    resumoItensHTML += `<div class="item-resumo-carrinho"><span>🍧 Copo da Felicidade<br><small style="color: #666;">Base: ${baseCopo} | Recheios: ${textoCopoRecheio || 'Nenhum'}</small></span> <strong>R$ ${valCopo.toFixed(2).replace('.', ',')}</strong></div>`;
                }
            }

            const massaCaseiro = document.getElementById('massa-bolo-caseiro').value;
            const recheioCaseiro = document.getElementById('recheio-bolo-caseiro').value;
            if (categoriaAtualAtiva === 'caseiro' && massaCaseiro) {
                let valCaseiro = 25.00;
                total += valCaseiro;
                resumoItensHTML += `<div class="item-resumo-carrinho"><span>🥮 Bolo Caseiro<br><small style="color: #666;">Massa: ${massaCaseiro} | Recheio: ${recheioCaseiro}</small></span> <strong>R$ ${valCaseiro.toFixed(2).replace('.', ',')}</strong></div>`;
            }

            const formaEntrega = document.getElementById('forma-entrega').value;
            if (formaEntrega === 'entrega' && total > 0) {
                total += 50.00;
                resumoItensHTML += `<div class="item-resumo-carrinho"><span>🛵 Taxa de Entrega</span> <strong>R$ 50,00</strong></div>`;
            }

            const textoTotalFormatado = `R$ ${total.toFixed(2).replace('.', ',')}`;
            document.getElementById('preco-total').innerText = textoTotalFormatado;
            document.getElementById('preco-carrinho-top').innerText = textoTotalFormatado;

            const conteinerLista = document.getElementById('carrinho-lista-itens');
            if (resumoItensHTML === '') {
                conteinerLista.innerHTML = '<p class="carrinho-vazio">Nenhum item selecionado no momento.</p>';
            } else {
                conteinerLista.innerHTML = resumoItensHTML;
            }
        }

        function enviarPedidoWhatsApp() {
            let temItem = false;
            
            const tamanho1 = document.getElementById('tamanho-andar-1').value;
            const recheio1 = document.getElementById('r1-andar-1').value;
            const temBolo = (categoriaAtualAtiva === 'bolo' && tamanho1 && recheio1);
            
            const valFinos = (categoriaAtualAtiva === 'doces-finos') ? document.getElementById('qtd-doces-finos').value : null;
            const valTrad = (categoriaAtualAtiva === 'doces-tradicionais') ? document.getElementById('qtd-doces-tradicionais').value : null;
            const valGourmet = (categoriaAtualAtiva === 'doces-gourmet') ? document.getElementById('qtd-doces-gourmet').value : null;
            const massaSobremesa = (categoriaAtualAtiva === 'sobremesa') ? document.getElementById('tipo-massa-sobremesa').value : null;
            const sobremesaPronta = (categoriaAtualAtiva === 'sobremesa') ? document.getElementById('sobremesa-pronta').value : null;
            const baseCopo = (categoriaAtualAtiva === 'sobremesa') ? document.getElementById('base-copo-felicidade').value : null;
            const massaCaseiro = (categoriaAtualAtiva === 'caseiro') ? document.getElementById('massa-bolo-caseiro').value : null;

            if (temBolo || valFinos || valTrad || valGourmet || massaSobremesa || sobremesaPronta || baseCopo || massaCaseiro) {
                temItem = true;
            }

            if (!temItem) {
                alert("Por favor, selecione as opções do produto antes de enviar o orçamento.");
                return;
            }

            const formaEntrega = document.getElementById('forma-entrega').value;
            let endereco = "";
            if (formaEntrega === 'entrega') {
                endereco = document.getElementById('endereco-cliente').value.trim();
                if (!endereco) {
                    alert("Por favor, preencha o endereço completo para entrega.");
                    document.getElementById('endereco-cliente').focus();
                    return;
                }
            }

            let mensagem = "Olá, Suellen Cakes! Gostaria de fazer o seguinte orçamento/pedido:\n\n";

            if (temBolo) {
                const qtdAndares = parseInt(document.getElementById('tipo-bolo').value);
                const massa = document.getElementById('massa-bolo').value;
                mensagem += `🎂 *Bolo Personalizado* (${qtdAndares} Andar/es)\n`;
                mensagem += `- Massa: ${massa}\n`;

                for (let andar = 1; andar <= qtdAndares; andar++) {
                    const selectTam = document.getElementById(`tamanho-andar-${andar}`);
                    const textoTamanho = selectTam.options[selectTam.selectedIndex].text;
                    const r1 = document.getElementById(`r1-andar-${andar}`).value;
                    const r2 = document.getElementById(`r2-andar-${andar}`).value;
                    const r3 = document.getElementById(`r3-andar-${andar}`).value;

                    mensagem += `  * ${andar}º Andar: ${textoTamanho}\n`;
                    mensagem += `  - Recheios: ${r1}`;
                    if (r2) mensagem += `, ${r2}`;
                    if (r3) mensagem += `, ${r3}`;
                    mensagem += `\n`;
                }

                const selectTopoGeral = document.getElementById('topo-bolo-geral');
                if (selectTopoGeral.value !== "0") {
                    const textoTopoGeral = selectTopoGeral.options[selectTopoGeral.selectedIndex].text;
                    mensagem += `- Topo: ${textoTopoGeral}\n`;
                }
                mensagem += "\n";
            }

            if (valFinos) {
                const selectDoces = document.getElementById('qtd-doces-finos');
                mensagem += `🍬 *Doces Finos:* ${selectDoces.options[selectDoces.selectedIndex].text}\n\n`;
            }

            if (valTrad) {
                const selectDoces = document.getElementById('qtd-doces-tradicionais');
                const textoQtd = selectDoces.options[selectDoces.selectedIndex].text.split('(')[0].trim();
                let saboresSelecionados = [];
                document.querySelectorAll('input[name="sabor-tradicional"]:checked').forEach(cb => {
                    saboresSelecionados.push(cb.value);
                });
                mensagem += `🍬 *Doces Tradicionais:* ${textoQtd}\n`;
                if (saboresSelecionados.length > 0) {
                    mensagem += `- Sabores: ${saboresSelecionados.join(', ')}\n`;
                }
                mensagem += "\n";
            }

            if (valGourmet) {
                const selectDoces = document.getElementById('qtd-doces-gourmet');
                const textoQtdGourmet = selectDoces.options[selectDoces.selectedIndex].text.split('(')[0].trim();
                let saboresGourmetSelecionados = [];
                document.querySelectorAll('input[name="sabor-gourmet"]:checked').forEach(cb => {
                    saboresGourmetSelecionados.push(cb.value);
                });
                mensagem += `🍬 *Doces Gourmet:* ${textoQtdGourmet}\n`;
                if (saboresGourmetSelecionados.length > 0) {
                    mensagem += `- Sabores: ${saboresGourmetSelecionados.join(', ')}\n`;
                }
                mensagem += "\n";
            }

            if (massaSobremesa) {
                const r1Pote = document.getElementById('recheio-sobremesa-1').value;
                const r2Pote = document.getElementById('recheio-sobremesa-2').value;
                mensagem += `🍰 *Bolo de Pote / Fatia de Bolo*\n`;
                mensagem += `- Massa: ${massaSobremesa}\n`;
                mensagem += `- Recheios: ${r1Pote || 'Nenhum'}${r2Pote ? ', ' + r2Pote : ''}\n\n`;
            }

            if (sobremesaPronta) {
                const selectPronta = document.getElementById('sobremesa-pronta');
                mensagem += `🍮 *Sobremesa Pronta:* ${selectPronta.options[selectPronta.selectedIndex].text}\n\n`;
            }

            if (baseCopo) {
                const rCopo1 = document.getElementById('recheio-copo-1').value;
                const rCopo2 = document.getElementById('recheio-copo-2').value;
                mensagem += `🍧 *Copo da Felicidade*\n`;
                mensagem += `- Sabor Base: ${baseCopo}\n`;
                mensagem += `- Recheios: ${rCopo1 || 'Nenhum'}${rCopo2 ? ', ' + rCopo2 : ''}\n\n`;
            }

            if (massaCaseiro) {
                const recheioCaseiro = document.getElementById('recheio-bolo-caseiro').value;
                mensagem += `🥮 *Bolo Caseiro Montado*\n`;
                mensagem += `- Massa: ${massaCaseiro}\n`;
                mensagem += `- Recheio: ${recheioCaseiro}\n\n`;
            }

            mensagem += `📦 *Forma de Retirada:* ${formaEntrega === 'entrega' ? 'Entrega em Domicílio' : 'Retirada na Confeitaria'}\n`;
            if (formaEntrega === 'entrega') {
                mensagem += `📍 *Endereço:* ${endereco}\n`;
            }

            const totalFinal = document.getElementById('preco-total').innerText;
            mensagem += `\n💰 *Total Estimado:* ${totalFinal}`;

            const numeroWhatsApp = "5527995336204";
            const urlWhatsApp = `https://wa.me/${numeroWhatsApp}?text=${encodeURIComponent(mensagem)}`;
            window.open(urlWhatsApp, '_blank');
        }
    </script>
