<!-- TELA 1: MONTAR BOLO PERSONALIZADO -->
    <div id="custom-bolo" class="secao tela-customizacao">
        <h2>Montar Bolo Personalizado</h2>
        <div class="calculadora-container">
            <div style="margin-bottom: 15px;">
                <label><input type="checkbox" id="check-bolo" onchange="alternarCamposBolo(); calcularTotal();"> <strong>Desejo incluir um Bolo Personalizado neste pedido</strong></label>
            </div>

            <div id="campos-bolo" style="display: none;">
                <div class="grupo-campo">
                    <label for="tipo-bolo"><strong>Quantidade de Andares:</strong></label>
                    <select id="tipo-bolo" onchange="atualizarAndaresBolo(); calcularTotal();">
                        <option value="1">1 Andar (Bolo Simples)</option>
                        <option value="2">2 Andares</option>
                        <option value="3">3 Andares</option>
                    </select>
                </div>

                <div class="grupo-campo">
                    <label for="massa-bolo"><strong>Escolha a Massa:</strong></label>
                    <select id="massa-bolo" onchange="calcularTotal()">
                        <option value="Massa Branca">Massa Branca</option>
                        <option value="Massa de Baunilha">Massa de Baunilha</option>
                        <option value="Massa Amanteigada">Massa Amanteigada</option>
                        <option value="Massa de Chocolate (Cacau 50%)">Massa de Chocolate (Cacau 50%)</option>
                        <option value="Red Velvet (+ R$ 10,00)">Red Velvet (+ R$ 10,00)</option>
                    </select>
                </div>

                <!-- ANDAR 1 -->
                <div id="painel-andar-1" style="border: 1px solid #e0e0e0; border-radius: 6px; padding: 12px; margin-top: 10px; background-color: #fafafa;">
                    <h4>1º Andar (Base)</h4>
                    <div class="grupo-campo">
                        <label for="tamanho-andar-1"><strong>Tamanho:</strong></label>
                        <select id="tamanho-andar-1" onchange="calcularTotal()">
                            <option value="80">10cm (~6 fatias) - R$ 80,00</option>
                            <option value="130" selected>15cm (~15 fatias) - R$ 130,00</option>
                            <option value="185">20cm (~25 fatias) - R$ 185,00</option>
                            <option value="270">25cm (~40 fatias) - R$ 270,00</option>
                            <option value="320">30cm (~50 fatias) - R$ 320,00</option>
                        </select>
                    </div>
                    <div class="grupo-campo">
                        <label><strong>Recheios (até 3):</strong></label>
                        <select id="r1-andar-1" onchange="calcularTotal()" style="margin-bottom: 5px;"></select>
                        <select id="r2-andar-1" onchange="calcularTotal()" style="margin-bottom: 5px;"></select>
                        <select id="r3-andar-1" onchange="calcularTotal()"></select>
                    </div>
                </div>

                <!-- ANDAR 2 -->
                <div id="painel-andar-2" style="display: none; border: 1px solid #e0e0e0; border-radius: 6px; padding: 12px; margin-top: 10px; background-color: #fafafa;">
                    <h4>2º Andar</h4>
                    <div class="grupo-campo">
                        <label for="tamanho-andar-2"><strong>Tamanho:</strong></label>
                        <select id="tamanho-andar-2" onchange="calcularTotal()">
                            <option value="80" selected>10cm (~6 fatias) - R$ 80,00</option>
                            <option value="130">15cm (~15 fatias) - R$ 130,00</option>
                            <option value="185">20cm (~25 fatias) - R$ 185,00</option>
                            <option value="270">25cm (~40 fatias) - R$ 270,00</option>
                        </select>
                    </div>
                    <div class="grupo-campo">
                        <label><strong>Recheios (até 3):</strong></label>
                        <select id="r1-andar-2" onchange="calcularTotal()" style="margin-bottom: 5px;"></select>
                        <select id="r2-andar-2" onchange="calcularTotal()" style="margin-bottom: 5px;"></select>
                        <select id="r3-andar-2" onchange="calcularTotal()"></select>
                    </div>
                </div>

                <!-- ANDAR 3 -->
                <div id="painel-andar-3" style="display: none; border: 1px solid #e0e0e0; border-radius: 6px; padding: 12px; margin-top: 10px; background-color: #fafafa;">
                    <h4>3º Andar (Topo)</h4>
                    <div class="grupo-campo">
                        <label for="tamanho-andar-3"><strong>Tamanho:</strong></label>
                        <select id="tamanho-andar-3" onchange="calcularTotal()">
                            <option value="80" selected>10cm (~6 fatias) - R$ 80,00</option>
                            <option value="130">15cm (~15 fatias) - R$ 130,00</option>
                            <option value="185">20cm (~25 fatias) - R$ 185,00</option>
                        </select>
                    </div>
                    <div class="grupo-campo">
                        <label><strong>Recheios (até 3):</strong></label>
                        <select id="r1-andar-3" onchange="calcularTotal()" style="margin-bottom: 5px;"></select>
                        <select id="r2-andar-3" onchange="calcularTotal()" style="margin-bottom: 5px;"></select>
                        <select id="r3-andar-3" onchange="calcularTotal()"></select>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- TELA 2: DOCES FINOS -->
    <div id="custom-doces" class="secao tela-customizacao">
        <h2>Adicionar Doces e Brigadeiros</h2>
        <div class="calculadora-container">
            <div style="margin-bottom: 15px;">
                <label><input type="checkbox" id="check-doces" onchange="alternarCampos('check-doces', 'campos-doces'); calcularTotal();"> <strong>Desejo incluir Doces neste pedido</strong></label>
            </div>
            <div id="campos-doces" style="display: none;" class="grupo-campo">
                <label for="qtd-doces"><strong>Quantidade e Tipo:</strong></label>
                <select id="qtd-doces" onchange="calcularTotal()">
                    <option value="45">50 Brigadeiros Tradicionais - R$ 45,00</option>
                    <option value="85">100 Brigadeiros Tradicionais - R$ 85,00</option>
                    <option value="120">50 Doces Finos Variados - R$ 120,00</option>
                    <option value="220">100 Doces Finos Variados - R$ 220,00</option>
                </select>
            </div>
        </div>
    </div>

    <!-- TELA 3: SOBREMESAS -->
    <div id="custom-sobremesa" class="secao tela-customizacao">
        <h2>Adicionar Sobremesas</h2>
        <div class="calculadora-container">
            <div style="margin-bottom: 15px;">
                <label><input type="checkbox" id="check-sobremesa" onchange="alternarCampos('check-sobremesa', 'campos-sobremesa'); calcularTotal();"> <strong>Desejo incluir Sobremesa neste pedido</strong></label>
            </div>
            <div id="campos-sobremesa" style="display: none;" class="grupo-campo">
                <label for="item-sobremesa"><strong>Escolha a Sobremesa:</strong></label>
                <select id="item-sobremesa" onchange="calcularTotal()">
                    <option value="50">Pudim Cremoso GG - R$ 50,00</option>
                    <option value="75">Taça da Felicidade (1.5L) - R$ 75,00</option>
                    <option value="65">Torta Holandesa - R$ 65,00</option>
                </select>
            </div>
        </div>
    </div>

    <!-- TELA 4: BOLOS CASEIROS -->
    <div id="custom-caseiro" class="secao tela-customizacao">
        <h2>Adicionar Bolo Caseiro</h2>
        <div class="calculadora-container">
            <div style="margin-bottom: 15px;">
                <label><input type="checkbox" id="check-caseiro" onchange="alternarCampos('check-caseiro', 'campos-caseiro'); calcularTotal();"> <strong>Desejo incluir Bolo Caseiro neste pedido</strong></label>
            </div>
            <div id="campos-caseiro" style="display: none;" class="grupo-campo">
                <label for="item-caseiro"><strong>Escolha o Bolo Caseiro:</strong></label>
                <select id="item-caseiro" onchange="calcularTotal()">
                    <option value="25">Bolo de Cenoura com Vulcão de Chocolate - R$ 25,00</option>
                    <option value="22">Bolo de Fubá com Goiabada - R$ 22,00</option>
                    <option value="28">Bolo Ninho com Nutella - R$ 28,00</option>
                </select>
            </div>
        </div>
    </div>

    <!-- SCRIPTS -->
    <script>
        const listaRecheios = [
            "Brigadeiro", "Ninho", "Nutella (+ R$ 15,00)", "Morango", "Abacaxi", 
            "Doce de leite", "Nozes", "Café", "Ganache", "Coco", "Amendoim", 
            "Pêssego", "Ameixa", "Brigadeiro branco", "Oreo", "Geleia de morango", 
            "Geleia de frutas vermelhas"
        ];

        function popularSelectsRecheio() {
            for (let andar = 1; andar <= 3; andar++) {
                for (let r = 1; r <= 3; r++) {
                    const select = document.getElementById(`r${r}-andar-${andar}`);
                    if (!select) continue;
                    select.innerHTML = '';

                    if (r === 1) {
                        listaRecheios.forEach(rec => {
                            select.innerHTML += `<option value="${rec}">${rec}</option>`;
                        });
                    } else {
                        select.innerHTML = `<option value="">-- Nenhum ${r}º recheio --</option>`;
                        listaRecheios.forEach(rec => {
                            select.innerHTML += `<option value="${rec}">${rec}</option>`;
                        });
                    }
                }
            }
        }

        function abrirCustomizacao(tipo) {
            document.getElementById('tela-principal').style.display = 'none';
            document.querySelectorAll('.tela-customizacao').forEach(el => el.style.display = 'none');
            
            document.getElementById('btn-voltar').style.display = 'flex';

            if (tipo === 'bolo') {
                document.getElementById('custom-bolo').style.display = 'block';
                document.getElementById('check-bolo').checked = true;
                alternarCamposBolo();
            }
            if (tipo === 'doces') {
                document.getElementById('custom-doces').style.display = 'block';
                document.getElementById('check-doces').checked = true;
                alternarCampos('check-doces', 'campos-doces');
            }
            if (tipo === 'sobremesa') {
                document.getElementById('custom-sobremesa').style.display = 'block';
                document.getElementById('check-sobremesa').checked = true;
                alternarCampos('check-sobremesa', 'campos-sobremesa');
            }
            if (tipo === 'caseiro') {
                document.getElementById('custom-caseiro').style.display = 'block';
                document.getElementById('check-caseiro').checked = true;
                alternarCampos('check-caseiro', 'campos-caseiro');
            }

            document.getElementById('painel-finalizacao').style.display = 'block';
            window.scrollTo({ top: 0, behavior: 'smooth' });
            calcularTotal();
        }

        function alternarCamposBolo() {
            const marcado = document.getElementById('check-bolo').checked;
            document.getElementById('campos-bolo').style.display = marcado ? 'block' : 'none';
        }

        function alternarCampos(checkId, camposId) {
            const marcado = document.getElementById(checkId).checked;
            document.getElementById(camposId).style.display = marcado ? 'block' : 'none';
        }

        function voltarParaInicio() {
            document.querySelectorAll('.tela-customizacao').forEach(el => el.style.display = 'none');
            document.getElementById('tela-principal').style.display = 'block';
            document.getElementById('btn-voltar').style.display = 'none';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function atualizarAndaresBolo() {
            const qtdAndares = parseInt(document.getElementById('tipo-bolo').value);
            document.getElementById('painel-andar-1').style.display = 'block';
            document.getElementById('painel-andar-2').style.display = (qtdAndares >= 2) ? 'block' : 'none';
            document.getElementById('painel-andar-3').style.display = (qtdAndares >= 3) ? 'block' : 'none';
        }

        function tratarMudancaEntrega() {
            const tipoEntrega = document.getElementById('forma-entrega').value;
            document.getElementById('painel-frete').style.display = (tipoEntrega === 'entrega') ? 'block' : 'none';
        }

        function calcularTotal() {
            let total = 0;

            const checkBolo = document.getElementById('check-bolo');
            if (checkBolo && checkBolo.checked) {
                const qtdAndares = parseInt(document.getElementById('tipo-bolo').value);
                if (document.getElementById('massa-bolo').value.includes('Red Velvet')) total += 10;

                for (let andar = 1; andar <= qtdAndares; andar++) {
                    total += parseFloat(document.getElementById(`tamanho-andar-${andar}`).value);
                    const r1 = document.getElementById(`r1-andar-${andar}`).value;
                    const r2 = document.getElementById(`r2-andar-${andar}`).value;
                    const r3 = document.getElementById(`r3-andar-${andar}`).value;

                    if (r1.includes('Nutella')) total += 15;
                    if (r2.includes('Nutella')) total += 15;
                    if (r3.includes('Nutella')) total += 15;
                }
            }

            const checkDoces = document.getElementById('check-doces');
            if (checkDoces && checkDoces.checked) {
                total += parseFloat(document.getElementById('qtd-doces').value);
            }

            const checkSobremesa = document.getElementById('check-sobremesa');
            if (checkSobremesa && checkSobremesa.checked) {
                total += parseFloat(document.getElementById('item-sobremesa').value);
            }

            const checkCaseiro = document.getElementById('check-caseiro');
            if (checkCaseiro && checkCaseiro.checked) {
                total += parseFloat(document.getElementById('item-caseiro').value);
            }

            if (document.getElementById('add-topper').checked) total += 15;
            if (document.getElementById('add-embalagem').checked) total += 10;

            if (document.getElementById('forma-entrega').value === 'entrega') {
                total += 50.00;
            }

            const textoTotal = `R$ ${total.toFixed(2).replace('.', ',')}`;
            document.getElementById('cart-total-header').innerText = textoTotal;
        }

        function enviarPedidoWhatsApp() {
            let itensSelecionados = [];

            const checkBolo = document.getElementById('check-bolo');
            if (checkBolo && checkBolo.checked) {
                const qtdAndares = parseInt(document.getElementById('tipo-bolo').value);
                const massa = document.getElementById('massa-bolo').value;

                let textoBolo = `🎂 *Bolo Personalizado (${qtdAndares} ${qtdAndares === 1 ? 'Andar' : 'Andares'}):*\n  - Massa: ${massa}`;

                for (let andar = 1; andar <= qtdAndares; andar++) {
                    const tamTexto = document.getElementById(`tamanho-andar-${andar}`).options[document.getElementById(`tamanho-andar-${andar}`).selectedIndex].text;
                    let recheios = [document.getElementById(`r1-andar-${andar}`).value];
                    const r2 = document.getElementById(`r2-andar-${andar}`).value;
                    const r3 = document.getElementById(`r3-andar-${andar}`).value;

                    if (r2 !== "") recheios.push(r2);
                    if (r3 !== "") recheios.push(r3);

                    textoBolo += `\n  - *${andar}º Andar:* ${tamTexto} | Recheios: ${recheios.join(", ")}`;
                }
                itensSelecionados.push(textoBolo);
            }

            const checkDoces = document.getElementById('check-doces');
            if (checkDoces && checkDoces.checked) {
                const doces = document.getElementById('qtd-doces').options[document.getElementById('qtd-doces').selectedIndex].text;
                itensSelecionados.push(`🍬 *Doces:* ${doces}`);
            }

            const checkSobremesa = document.getElementById('check-sobremesa');
            if (checkSobremesa && checkSobremesa.checked) {
                const sobremesa = document.getElementById('item-sobremesa').options[document.getElementById('item-sobremesa').selectedIndex].text;
                itensSelecionados.push(`🍮 *Sobremesa:* ${sobremesa}`);
            }

            const checkCaseiro = document.getElementById('check-caseiro');
            if (checkCaseiro && checkCaseiro.checked) {
                const caseiro = document.getElementById('item-caseiro').options[document.getElementById('item-caseiro').selectedIndex].text;
                itensSelecionados.push(`🥮 *Bolo Caseiro:* ${caseiro}`);
            }

            let adicionais = [];
            if (document.getElementById('add-topper').checked) adicionais.push("Topper Personalizado");
            if (document.getElementById('add-embalagem').checked) adicionais.push("Embalagem Especial");
            
            if (adicionais.length > 0) {
                itensSelecionados.push(`🎁 *Adicionais:* ${adicionais.join(", ")}`);
            }

            if (itensSelecionados.length === 0) {
                alert("Por favor, selecione pelo menos um item para montar seu pedido!");
                return;
            }

            const formaEntrega = document.getElementById('forma-entrega').value;
            if (formaEntrega === 'retirada') {
                itensSelecionados.push(`🚗 *Entrega/Retirada:* Retirar na Confeitaria (Sem taxa de frete)`);
            } else {
                const endereco = document.getElementById('endereco-cliente').value.trim();
                let infoFrete = `🛵 *Entrega em Domicílio:* Taxa fixa R$ 50,00`;
                if (endereco !== "") infoFrete += `\n  - Endereço: ${endereco}`;
                itensSelecionados.push(infoFrete);
            }

            const total = document.getElementById('cart-total-header').innerText;
            const mensagemTexto = `Olá! Gostaria de fazer o seguinte pedido:\n\n` + itensSelecionados.join("\n\n") + `\n\n*VALOR TOTAL ESTIMADO:* ${total}`;
            
            const numeroWhatsApp = "5527995336204"; 
            window.open(`https://wa.me/${numeroWhatsApp}?text=${encodeURIComponent(mensagemTexto)}`, '_blank');
        }

        window.onload = function() {
            popularSelectsRecheio();
            
            // Garante que todas as caixas iniciem desmarcadas e o valor seja R$ 0,00
            document.getElementById('check-bolo').checked = false;
            document.getElementById('check-doces').checked = false;
            document.getElementById('check-sobremesa').checked = false;
            document.getElementById('check-caseiro').checked = false;
            document.getElementById('add-topper').checked = false;
            document.getElementById('add-embalagem').checked = false;
            
            calcularTotal();
        };
    </script>
